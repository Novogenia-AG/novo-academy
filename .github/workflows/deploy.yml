name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE_PATH: /
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      # GitHub Pages liefert bei unbekannten Pfaden seine eigene 404-Seite.
      # Dieselbe index.html als 404.html laedt stattdessen die App.
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Das Artefakt ist ~182 MB (grosse Demo-Berichte und Schulungsfolien
          # unter public/course-materials). Der Standard-Timeout von 10 Minuten
          # reicht dafuer nicht zuverlaessig — zwei Deploys sind am 2026-08-06
          # mit "Timeout reached, aborting!" gescheitert, obwohl der Build lief.
          # Dauerhafte Loesung waere, die grossen Dateien nach Supabase Storage
          # auszulagern (offenes TODO in CLAUDE.md Abschnitt 11).
          timeout: 1800000   # 30 Minuten in Millisekunden
