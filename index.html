<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NOVO ACADEMY — Novogenia</title>
    <meta name="description" content="Die offizielle Schulungsplattform von Novogenia. Lerne genetische Beratung in deinem Tempo, schließe Module mit Tests ab und erhalte dein Zertifikat als Genetik Coach." />

    <!-- ===== SECURITY HEADERS (meta fallback for GitHub Pages static hosting) ===== -->
    <!-- Content-Security-Policy: allowlist every source the app needs -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'none';
      script-src  'self' blob:;
      style-src   'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src    'self' https://fonts.gstatic.com;
      img-src     'self' data: blob: https://img.youtube.com https://i.ytimg.com;
      connect-src 'self'
                  https://*.supabase.co
                  wss://*.supabase.co
                  https://fonts.googleapis.com
                  https://fonts.gstatic.com
                  https://github.com
                  https://objects.githubusercontent.com
                  https://raw.githubusercontent.com;
      frame-src   https://www.youtube.com https://www.youtube-nocookie.com;
      worker-src  'self' blob:;
      object-src  'none';
      base-uri    'self';
      form-action 'self';
    " />
    <!-- Clickjacking-Schutz: X-Frame-Options UND CSP frame-ancestors sind als
         <meta> wirkungslos — beides verlangt einen echten HTTP-Header, den
         GitHub Pages nicht setzen kann (im Browser verifiziert: "may only be
         set via an HTTP header" bzw. "is ignored when delivered via a <meta>").
         Solange die Seite auf GitHub Pages liegt, ist das Frame-Busting unten
         der einzige wirksame Schutz. Bei einem Wechsel auf Cloudflare Pages /
         Netlify stattdessen echte Header setzen und dies hier entfernen. -->
    <!-- Das Frame-Busting steht in src/main.jsx, NICHT hier als Inline-Skript:
         die CSP erlaubt nur `script-src 'self' blob:`, ein Inline-Skript wuerde
         blockiert (im Browser verifiziert). -->
    <!-- Limit referrer leakage (als <meta name> gültig) -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- ===== FONTS ===== -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Montserrat only — all 7 weights are used by the design system.
         (Caveat was requested here but never referenced in any stylesheet;
         removed so it no longer costs a font download on every visit.) -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Warm up the Supabase connection so the first auth/session call is faster -->
    <link rel="preconnect" href="https://whjxtrrztfzhjqtsyqqf.supabase.co" crossorigin>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
